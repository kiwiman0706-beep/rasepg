# RASEPG - 録画スタック (Mirakurun / mirakc + EPGStation + MariaDB)
# 管理パネル(RASEPG Admin)はホスト側 systemd で動作するためここには含めません。
#
# チューナーサーバは Mirakurun と mirakc の両対応。profile で切り替えます:
#   Mirakurun: docker compose --profile mirakurun up -d   (既定/情報量多)
#   mirakc   : docker compose --profile mirakc    up -d   (軽量/Rust製)
# 切替は RASEPG Admin の[サービス]タブから(推奨)。EPGStation の接続先も自動で書き換わります。
#
# パス/保存先は .env で切り替えます（.env は RASEPG Admin が自動生成）。
services:
  mirakurun:
    profiles: ["mirakurun"]
    # recdvb(--b25) + libarib25 + pcsclite を同梱したカスタムイメージ
    build:
      context: ./mirakurun
      dockerfile: Dockerfile
    image: rasepg/mirakurun:local
    container_name: mirakurun
    restart: unless-stopped
    init: true
    devices:
      # 地デジ用 DVB アダプタ (PX-Q1UD は smsdvb で /dev/dvb/adapterN として見える)
      - /dev/dvb:/dev/dvb
    volumes:
      - ./mirakurun/tuners.yml:/app-config/tuners.yml
      - ./mirakurun/channels.yml:/app-config/channels.yml
      - ./mirakurun/server.yml:/app-config/server.yml
      - mirakurun-data:/app-data
      # ホストの pcscd ソケットを共有して B-CAS を読む
      - /run/pcscd:/run/pcscd
    environment:
      TZ: ${TZ:-Asia/Tokyo}
    ports:
      - "40772:40772"   # Mirakurun 互換 API
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  mirakc:
    profiles: ["mirakc"]
    # mirakc(Rust・軽量) + recdvb を同梱したカスタムイメージ
    build:
      context: ./mirakc
      dockerfile: Dockerfile
    image: rasepg/mirakc:local
    container_name: mirakc
    restart: unless-stopped
    init: true
    devices:
      - /dev/dvb:/dev/dvb
    volumes:
      - ./mirakc/config.yml:/etc/mirakc/config.yml
      - mirakc-data:/var/lib/mirakc
      - /run/pcscd:/run/pcscd
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      RUST_LOG: info
    ports:
      # Mirakurun と同じ 40772。両方同時起動はしない(profile で片方のみ)
      - "40772:40772"   # mirakc = Mirakurun 互換 API
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  mariadb:
    image: mariadb:10.11
    container_name: rasepg-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rasepg-root}
      MYSQL_DATABASE: ${DB_NAME:-epgstation}
      MYSQL_USER: ${DB_USER:-epgstation}
      MYSQL_PASSWORD: ${DB_PASSWORD:-epgstation}
      TZ: ${TZ:-Asia/Tokyo}
    command: >-
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --performance-schema=off
      --expire-logs-days=1
    volumes:
      - mariadb-data:/var/lib/mysql
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  epgstation:
    image: l3tnun/epgstation:master-debian
    container_name: epgstation
    restart: unless-stopped
    # チューナーは profile で片方のみ起動するため hard-dep にしない
    # (EPGStation は接続先を自動リトライする)
    depends_on:
      - mariadb
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      # エンコード品質(RASEPG Admin から .env 経由で設定)
      RASEPG_HEIGHT: ${RASEPG_HEIGHT:-720}
      RASEPG_VBITRATE: ${RASEPG_VBITRATE:-2000k}
      RASEPG_ABITRATE: ${RASEPG_ABITRATE:-128k}
      RASEPG_CRF: ${RASEPG_CRF:-23}
      RASEPG_PRESET: ${RASEPG_PRESET:-veryfast}
    devices:
      # HW エンコード(h264_v4l2m2m)用に VideoCore を渡す
      - /dev/video10:/dev/video10   # h264 encode
      - /dev/video11:/dev/video11   # h264 decode
      - /dev/video12:/dev/video12   # ISP/scaler
    volumes:
      - ./epgstation/config.yml:/app/config/config.yml
      - ./epgstation/enc:/app/config/enc
      - ./epgstation/logo:/app/thumbnail
      - epgstation-data:/app/data
      # 一時保存(録画/エンコード作業) と 最終保存(NAS) をホストからバインド
      - ${RECORDED_TMP:-./recorded}:/recorded          # 録画一時(.ts) + エンコード出力
      - ${RECORDED_NAS:-./nas}:/nas                     # NAS 最終保存先(SMB マウント先)
    ports:
      - "8888:8888"   # EPGStation Web UI
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  mirakurun-data:
  mirakc-data:
  mariadb-data:
  epgstation-data:
